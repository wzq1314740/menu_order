<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12291F">
<link rel="icon" href="images/emblem-gold.png">
<title>订单看板 · 桂亭</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/orders.css">
</head>
<body>

<header class="top">
  <img class="logo" src="images/emblem-cream.png" alt="">
  <div class="ttl-box">
    <div class="ttl">订单看板</div>
    <div class="sub" id="storeName">桂亭</div>
  </div>
  <div class="sp"></div>
  <div class="conn" id="conn" hidden>连接中断，正在重试…</div>
  <button class="tbtn" id="soundBtn">开启提醒</button>
  <a class="tbtn" href="/admin.html" id="adminLink" hidden>菜单后台</a>
  <button class="tbtn" id="logoutBtn">退出</button>
</header>

<div class="bar">
  <div class="tabs" id="statusTabs">
    <button data-st="active" class="on">待处理<em></em></button>
    <button data-st="new">新单<em></em></button>
    <button data-st="confirmed">已确认<em></em></button>
    <button data-st="done">已完成<em></em></button>
    <button data-st="cancelled">已取消<em></em></button>
    <button data-st="all">全部<em></em></button>
  </div>
  <div class="sp"></div>
  <div class="filters">
    <select class="inp" id="tableFilter"><option value="">全部桌号</option></select>
    <input class="inp" type="date" id="dateInput">
    <div class="seg" id="viewSeg">
      <button data-view="orders" class="on">按订单</button>
      <button data-view="tables">按桌汇总</button>
    </div>
  </div>
</div>

<main class="board" id="board">
  <div class="empty"><p>载入中…</p></div>
</main>

<div id="printArea"></div>
<script type="module" src="js/orders.js"></script>
</body>
</html>
