<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12291F">
<link rel="icon" href="images/emblem-gold.png">
<title>登录 · 桂亭</title>
<link rel="stylesheet" href="css/base.css">
<style>
body{min-height:100vh;min-height:100dvh;background:var(--green-3);display:grid;place-items:center;
  padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));}
.box{width:min(380px,100%);background:var(--paper);border-radius:4px;padding:34px 28px 26px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.3);}
.box img{width:54px;height:54px;object-fit:contain;margin:0 auto 10px;}
.box h1{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:.24em;margin:0;}
.box .sub{font-size:12px;letter-spacing:.1em;color:var(--ink-3);margin:8px 0 22px;line-height:1.8;}
.box .inp{height:50px;text-align:center;font-size:20px;letter-spacing:.3em;}
.box .btn-solid{width:100%;margin-top:14px;}
.err{min-height:20px;margin-top:10px;font-size:12.5px;color:var(--red);}
.links{margin-top:14px;font-size:12px;color:var(--ink-3);}
.links a{color:var(--gold-ink);}
</style>
</head>
<body>
<form class="box" id="form" autocomplete="off">
  <img src="images/emblem-gold.png" alt="">
  <h1>桂亭</h1>
  <div class="sub" id="sub">请输入口令<br>员工口令可查看订单，管理口令可管理菜单</div>
  <input class="inp" id="pin" type="password" inputmode="numeric" placeholder="口令" autofocus required>
  <div class="err" id="err"></div>
  <button class="btn-solid" id="btn" type="submit">登录</button>
  <div class="links"><a href="/">返回点餐页</a></div>
</form>
<script type="module">
import { $, api } from './js/common.js';

const qs = new URLSearchParams(location.search);
let next = qs.get('next') || '/orders.html';
if (!/^\/[\w\-.\/]*$/.test(next)) next = '/orders.html';
const needAdmin = qs.get('need') === 'admin';
if (needAdmin) $('#sub').innerHTML = '菜单后台需要<b>管理口令</b>';

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pin = $('#pin').value.trim();
  if (!pin) return;
  $('#btn').disabled = true;
  $('#err').textContent = '';
  try {
    const res = await api('/api/login', { method: 'POST', body: { pin } });
    if (needAdmin && res.role !== 'admin') {
      $('#err').textContent = '这是员工口令，菜单后台需要管理口令';
      $('#btn').disabled = false;
      return;
    }
    location.replace(next);
  } catch (err) {
    $('#err').textContent = err.message;
    $('#pin').select();
    $('#btn').disabled = false;
  }
});
</script>
</body>
</html>
